name: Build Release APK

on:
  push:
    branches: [ new ]
    tags:
      - 'v*'
  pull_request:
    branches: [ new ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive   # kéo HookTool submodule

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create gradle/libs.versions.toml
        run: |
          mkdir -p gradle
          cat > gradle/libs.versions.toml << 'EOF'
          [versions]
          agp    = "9.2.1"
          kotlin = "2.1.20"

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          android-library     = { id = "com.android.library",     version.ref = "agp" }
          kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          EOF

      - name: Upgrade Gradle wrapper to 8.11.1
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip|' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Write keystore & signing properties
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          K_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > release.jks

          printf "KEYSTORE_PASSWORD=%s\n"       "$K_PASS"   > signing.properties
          printf "KEYSTORE_ALIAS=%s\n"          "$K_ALIAS"  >> signing.properties
          printf "KEYSTORE_ALIAS_PASSWORD=%s\n" "$K_PASS"   >> signing.properties
          printf "KEYSTORE_FILE=../release.jks\n"            >> signing.properties

      - name: Generate local.properties
        env:
          K_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT"        > local.properties
          echo "keyStoreFile=../release.jks"       >> local.properties
          echo "keyStorePassword=$K_PASS"          >> local.properties
          echo "keyAlias=$K_ALIAS"                 >> local.properties
          echo "keyAliasPassword=$K_PASS"          >> local.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Find built APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppRetention-release
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
